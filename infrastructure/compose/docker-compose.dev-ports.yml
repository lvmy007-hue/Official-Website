# 本地调试用端口映射（叠加在 docker-compose.yml 之上）：数据库、Redis、接口服务默认不对外暴露，
# 需要在宿主机上直接运行接口/前端开发服务器，或用客户端工具连接数据库时才叠加本文件。全部只绑定本机回环地址。
#   docker compose -f infrastructure/compose/docker-compose.yml -f infrastructure/compose/docker-compose.dev-ports.yml up --build
# 端口刻意避开 5432、6379（常被其他项目占用）。生产环境不要使用本文件。
services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  pgbouncer:
    ports: ["127.0.0.1:16432:6432"]
  queue-redis:
    ports: ["127.0.0.1:16379:6379"]
  cache-redis:
    ports: ["127.0.0.1:16380:6379"]
  api:
    ports: ["127.0.0.1:4000:4000"]
