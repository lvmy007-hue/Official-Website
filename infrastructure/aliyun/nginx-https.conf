# Host-level TLS front for dzanx.com. The docker `web` container (nginx.conf) listens on 127.0.0.1:8080.
# Certificate paths assume an Aliyun SSL certificate downloaded in nginx format; replace them with the real files.
server {
  listen 80;
  listen [::]:80;
  server_name dzanx.com www.dzanx.com;
  return 301 https://dzanx.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.dzanx.com;
  ssl_certificate     /etc/nginx/ssl/dzanx.com.pem;
  ssl_certificate_key /etc/nginx/ssl/dzanx.com.key;
  return 301 https://dzanx.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name dzanx.com;
  server_tokens off;

  ssl_certificate     /etc/nginx/ssl/dzanx.com.pem;
  ssl_certificate_key /etc/nginx/ssl/dzanx.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
