server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; }
  location = / { try_files /index.html =404; }
  location ~ ^/(site|about|news|resources|contact|privacy|terms|security|login|pricing|product|product/stores|product/orders|product/returns|product/finance|product/advertising|product/permissions|product/inventory|product/listings|product/inbound|solutions|solutions/advertising)$ { try_files /index.html =404; }
  location ^~ /app/ { try_files /index.html =404; }
  location / { return 404; }
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?|txt|xml|map|md)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
}
