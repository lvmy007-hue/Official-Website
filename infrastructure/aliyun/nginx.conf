map $http_x_forwarded_proto $nova_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  # 批量搜索（P6-04）把最多 500 个词放在 GET 的 qs 参数里（总长不超过 12000 字符），默认 8k 的请求行会被拒绝
  large_client_header_buffers 4 32k;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

  # Locations below use `expires` instead of add_header so these headers stay inherited everywhere.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;
  location = /404.html { internal; expires -1; }

  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  # 本地驱动的文件直传（P1-23）：请求体上限高于应用侧 STORAGE_MAX_UPLOAD_MB（默认 50），由接口服务按令牌里的大小精确校验；不缓冲，直接流式转发
  location ^~ /api/v1/storage/local/ { client_max_body_size 64m; proxy_request_buffering off; proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $nova_forwarded_proto; proxy_read_timeout 120s; proxy_send_timeout 120s; }
  location /api/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $nova_forwarded_proto; proxy_read_timeout 60s; }

  # Public pages are prerendered to <path>/index.html at build time.
  location = / { expires -1; try_files /index.html =404; }
  location = /site { expires -1; try_files /index.html =404; }
  location ~ ^/(about|news|resources|contact|privacy|terms|security|pricing|product|product/stores|product/orders|product/returns|product/finance|product/advertising|product/permissions|product/inventory|product/listings|product/inbound|solutions|solutions/advertising|en|en/product|en/pricing|en/about|en/contact|en/privacy|en/terms|en/security)$ { expires -1; try_files $uri/index.html =404; }

  # The workspace loads a bare shell without prerendered marketing markup.
  # Workspace pages (login and ERP only; the public website locations above are untouched) carry a Content-Security-Policy and
  # cannot be framed. add_header in a location replaces inherited headers, so the common ones are repeated here (P1-17).
  # style-src needs 'unsafe-inline' because Ant Design injects component styles at runtime; scripts stay same-origin only.
  location = /login {
    expires -1; try_files /app.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.media-amazon.com https://*.ssl-images-amazon.com https://*.images-amazon.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
  location = /app {
    expires -1; try_files /app.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.media-amazon.com https://*.ssl-images-amazon.com https://*.images-amazon.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
  location ^~ /app/ {
    expires -1; try_files /app.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.media-amazon.com https://*.ssl-images-amazon.com https://*.images-amazon.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
  location ^~ /platform/ {
    expires -1; try_files /app.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.media-amazon.com https://*.ssl-images-amazon.com https://*.images-amazon.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
  location ^~ /invite/ {
    expires -1; try_files /app.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.media-amazon.com https://*.ssl-images-amazon.com https://*.images-amazon.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location ^~ /assets/ { expires 1y; try_files $uri =404; }
  location ^~ /.vite/ { return 404; }
  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ { expires 7d; try_files $uri =404; }
  location ~* \.(?:txt|xml)$ { expires 1h; try_files $uri =404; }
  location / { return 404; }
}
